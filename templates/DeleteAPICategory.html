<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Delete Category</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5" style="max-width:600px;">
  <h2 class="mb-4 text-danger">Delete Category (DELETE)</h2>
  <form id="deleteForm">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Category ID</label>
      <input type="number" class="form-control" id="categoryId" required>
      <div class="form-text">បញ្ចូល ID នៃ Category ដែលចង់លុប</div>
    </div>
    <button type="submit" class="btn btn-danger">Delete Category</button>
  </form>
  <div id="msg" class="mt-3"></div>
</div>
<script>
const API_BASE = "/api/APICategoryLC/";

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(c.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
const csrftoken = getCookie("csrftoken");

document.getElementById("deleteForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const id = document.getElementById("categoryId").value;
  if (!id) return;

  const ok = confirm(`Are you sure you want to delete Category ID = ${id}?`);
  if (!ok) return;

  try {
    const res = await fetch(API_BASE + id + "/", {
      method: "DELETE",
      credentials: "same-origin",
      headers: { "X-CSRFToken": csrftoken }
    });
    if (res.status === 204) {
      document.getElementById("msg").innerHTML =
        `<div class="alert alert-success">Deleted successfully ✅ (ID: ${id})</div>`;
      document.getElementById("deleteForm").reset();
      return;
    }
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error(data ? JSON.stringify(data) : ("HTTP " + res.status));
    document.getElementById("msg").innerHTML =
      `<div class="alert alert-success">Deleted successfully ✅ (ID: ${id})</div>`;
    document.getElementById("deleteForm").reset();
  } catch (err) {
    document.getElementById("msg").innerHTML =
      `<div class="alert alert-danger">Error: ${err.message}</div>`;
  }
});
</script>
</body>
</html>
