<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Delete Task - CRM System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f0f2f5;
      }
      .sidebar {
        min-height: 100vh;
        background: linear-gradient(180deg, #1a3c5e 0%, #2d6a9f 100%);
        width: 240px;
        position: fixed;
        padding-top: 20px;
      }
      .sidebar .brand {
        color: white;
        font-size: 1.3rem;
        font-weight: 700;
        padding: 0 20px 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }
      .sidebar a {
        color: rgba(255, 255, 255, 0.8);
        text-decoration: none;
        display: block;
        padding: 12px 20px;
        transition: all 0.2s;
      }
      .sidebar a:hover,
      .sidebar a.active {
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }
      .sidebar a i {
        margin-right: 10px;
      }
      .main-content {
        margin-left: 240px;
        padding: 30px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex">
      <div class="sidebar">
        <div class="brand"><i class="bi bi-diagram-3"></i> CRM System</div>
        <div class="mt-3">
          <a href="/dashboard/"><i class="bi bi-speedometer2"></i> Dashboard</a>
          <a href="/customers/"><i class="bi bi-people"></i> Customers</a>
          <a href="/leads/"><i class="bi bi-funnel"></i> Leads</a>
          <a href="/opportunities/"
            ><i class="bi bi-trophy"></i> Opportunities</a
          >
          <a href="/interactions/"
            ><i class="bi bi-chat-dots"></i> Interactions</a
          >
          <a href="/tasks/" class="active"
            ><i class="bi bi-check2-square"></i> Tasks</a
          >
          <a href="/support/"><i class="bi bi-headset"></i> Support</a>
    
          <a href="/admin/"><i class="bi bi-gear"></i> Admin Panel</a>
                  <a href="/api/api-explorer/"><i class="bi bi-braces"></i> API Explorer</a>
          <div
            style="
              border-top: 1px solid rgba(255, 255, 255, 0.1);
              margin: 20px 0;
            "
          ></div>
          <a href="/accounts/logout/"
            ><i class="bi bi-box-arrow-left"></i> Logout</a
          >
        </div>
      </div>

      <div
        class="main-content w-100 d-flex align-items-center justify-content-center"
        style="min-height: 100vh"
      >
        <div
          class="card border-0 shadow-sm rounded-3"
          style="max-width: 480px; width: 100%"
        >
          <div class="card-body p-5 text-center">
            <div class="mb-3">
              <span
                class="d-inline-flex align-items-center justify-content-center rounded-circle bg-danger bg-opacity-10"
                style="width: 64px; height: 64px"
              >
                <i class="bi bi-trash fs-2 text-danger"></i>
              </span>
            </div>
            <h5 class="fw-bold mb-2">Delete Task</h5>
            <p class="text-muted mb-4">
              Are you sure you want to delete
              <strong>"{{ task.title }}"</strong>? This action cannot be undone.
            </p>
            <form method="post">
              {% csrf_token %}
              <div class="d-flex gap-3 justify-content-center">
                <button type="submit" class="btn btn-danger px-4">
                  <i class="bi bi-trash me-1"></i> Yes, Delete
                </button>
                <a
                  href="{% url 'task_detail' task.pk %}"
                  class="btn btn-outline-secondary px-4"
                  >Cancel</a
                >
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
