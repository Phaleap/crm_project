{% extends 'base.html' %}
{% block nav_customers %}class="active"{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card border-0 shadow-sm rounded-3 text-center p-5">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle text-danger" style="font-size:3rem"></i>
            </div>
            <h5 class="fw-bold">Delete Customer?</h5>
            <p class="text-muted">Are you sure you want to delete <strong>{{ customer.full_name }}</strong>? This action cannot be undone.</p>
            <form method="post" class="d-flex gap-2 justify-content-center mt-3">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-4"><i class="bi bi-trash me-1"></i> Yes, Delete</button>
                <a href="/customers/{{ customer.pk }}/" class="btn btn-outline-secondary px-4">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
