<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Update Category</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5" style="max-width:600px;">
  <h2 class="mb-4">Update Category (PUT)</h2>
  <form id="updateForm" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="mb-3">
      <label class="form-label">Category ID</label>
      <input type="number" class="form-control" id="categoryId" required>
      <div class="form-text">ID នៃ Category ដែលចង់ Update</div>
    </div>
    <div class="mb-3">
      <label class="form-label">Category Name</label>
      <input type="text" class="form-control" id="categoryName">
    </div>
    <div class="mb-3">
      <label class="form-label">Category Image (optional)</label>
      <input type="file" class="form-control" id="categoryImage">
    </div>
    <button type="submit" class="btn btn-warning">Update Category</button>
  </form>
  <div id="msg" class="mt-3"></div>
</div>
<script>
const API_BASE = "/api/APICategoryLC/";

function getCookie(name) {
  let cookieValue = null;
  if (document.cookie && document.cookie !== "") {
    const cookies = document.cookie.split(";");
    for (let c of cookies) {
      c = c.trim();
      if (c.startsWith(name + "=")) {
        cookieValue = decodeURIComponent(c.substring(name.length + 1));
        break;
      }
    }
  }
  return cookieValue;
}
const csrftoken = getCookie("csrftoken");

document.getElementById("updateForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const id    = document.getElementById("categoryId").value;
  const name  = document.getElementById("categoryName").value;
  const image = document.getElementById("categoryImage").files[0];

  if (!id) { alert("Category ID is required"); return; }

  const formData = new FormData();
  if (name)  formData.append("categoryName", name);
  if (image) formData.append("categoryImage", image);

  try {
    const res = await fetch(API_BASE + id + "/", {
      method: "PUT",
      credentials: "same-origin",
      headers: { "X-CSRFToken": csrftoken },
      body: formData
    });
    const data = await res.json().catch(() => null);
    if (!res.ok) throw new Error(data ? JSON.stringify(data) : "Update failed");
    document.getElementById("msg").innerHTML =
      `<div class="alert alert-success">Category updated successfully ✅</div>`;
    document.getElementById("updateForm").reset();
  } catch (err) {
    document.getElementById("msg").innerHTML =
      `<div class="alert alert-danger">Error: ${err.message}</div>`;
  }
});
</script>
</body>
</html>
